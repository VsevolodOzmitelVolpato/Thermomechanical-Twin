# On every push to main and every pull request: builds the C++ core in Release mode, builds the Python module,
# runs all the tests (C++ and Python) and runs the two studies in their quick mode.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the Python packages
        run: pip install -r requirements.txt

      - name: Configure (Release build)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run the C++ and Python tests
        run: ctest --test-dir build --output-on-failure

      - name: Run the two studies in their quick mode
        run: |
          python scripts/rom_benchmark.py --quick
          python scripts/uq_sobol.py --quick
